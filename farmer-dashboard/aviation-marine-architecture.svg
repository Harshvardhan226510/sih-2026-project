<rect x="665" y="116" width="175" height="94" rx="9" fill="#112941"/><text x="679" y="138" fill="#dfeaf0" font-family="Arial" font-size="14" font-weight="700">Airport Search (ICAO)</text><rect x="679" y="149" width="145" height="24" rx="5" fill="#0a1c2e" stroke="#476178"/><text x="687" y="166" fill="#9caebe" font-family="Arial" font-size="12">Enter ICAO Code</text><text x="679" y="194" fill="#dfeaf0" font-family="Arial" font-size="12">DEL — Indira Gandhi Intl.</text>
