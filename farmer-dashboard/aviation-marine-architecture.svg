<rect class="box" x="1345" y="831" width="445" height="88" rx="14" fill="#a8d18e"/><text class="t head" text-anchor="middle" x="1568" y="865">Cross-Module Integration</text><text class="t body" text-anchor="middle" x="1568" y="891">In-memory handshake to WeatherGPT Chatbot</text><rect class="box" x="1345" y="939" width="445" height="86" rx="14" fill="#a8d18e"/><text class="t head" text-anchor="middle" x="1568" y="973">Command Center Modules</text><text class="t body" text-anchor="middle" x="1568" y="999">Live Tracking · GIS &amp; Map · Alerts · Reports · Advisory</text>
