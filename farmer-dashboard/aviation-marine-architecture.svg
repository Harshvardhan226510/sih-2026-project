<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <linearGradient id="front" x1="0" x2="1"><stop stop-color="#fff5e7"/><stop offset="1" stop-color="#f6e3c8"/></linearGradient>
  <linearGradient id="core" x1="0" x2="1"><stop stop-color="#ebfae8"/><stop offset="1" stop-color="#d6f0d0"/></linearGradient>
  <linearGradient id="data" x1="0" x2="1"><stop stop-color="#fff7d6"/><stop offset="1" stop-color="#f7e8b5"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#151a1d"/></marker>
  <style>
    .zone{stroke:#5e6565;stroke-width:2;stroke-dasharray:6 5}.box{stroke:#6a7670;stroke-width:2}.t{font-family:Arial,Helvetica,sans-serif;fill:#121719}.title{font-size:25px;font-weight:700}.sub{font-size:17px}.head{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.wire{stroke:#151a1d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.thin{stroke:#151a1d;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1920" height="1080" fill="#fcfcf8"/>

