<!-- CORE -->
<rect class="zone" x="14" y="398" width="1892" height="352" rx="17" fill="url(#core)"/>
<text class="t title" x="34" y="433">2. CORE PROCESSING &amp; ANALYTICS LAYER</text><text class="t sub" x="34" y="456">Python FastAPI + SQLite · high-performance async backend</text>
<rect class="box" x="685" y="416" width="548" height="60" rx="13" fill="#f7f7f3"/><circle cx="720" cy="446" r="17" fill="#21a487"/><text x="712" y="453" fill="#fff" font-family="Arial" font-size="23">ϟ</text><text class="t title" x="752" y="454">FastAPI Application</text>
<path class="wire" d="M790 362V416"/><path class="wire" d="M1040 362V416"/><path class="wire" d="M1260 362V416"/>
<text class="t small" x="690" y="393">Streaming API responses</text><text class="t small" x="1000" y="393">Forecasts / telemetry</text><text class="t small" x="1240" y="393">Analytics logs</text>
<rect class="box" x="95" y="505" width="450" height="210" rx="14" fill="#d1ebc7"/><text class="t head" text-anchor="middle" x="320" y="536">[A. AVIATION ANALYTICS ENGINE]</text><text class="t sub" text-anchor="middle" x="320" y="558">aviation.py</text><text class="t body" x="120" y="587">• Dual-chain transponder querying</text><text class="t body" x="120" y="610">• Live flight state interception</text><text class="t body" x="120" y="633">• METAR &amp; TAF retrieval and parsing</text><text class="t body" x="120" y="656">• Headwind / tailwind, fuel &amp; time impact</text><text class="t body" x="120" y="679">• Mock fallback on API rate limit (429)</text>
<rect class="box" x="590" y="505" width="450" height="210" rx="14" fill="#d1ebc7"/><text class="t head" text-anchor="middle" x="815" y="536">[B. MARINE ANALYTICS ENGINE]</text><text class="t sub" text-anchor="middle" x="815" y="558">marine.py</text><text class="t body" x="615" y="587">• Waypoint interpolation (A → B)</text><text class="t body" x="615" y="610">• Marine weather, wave &amp; sea-state analysis</text><text class="t body" x="615" y="633">• Cyclone intersection detection</text><text class="t body" x="615" y="656">• Haversine-distance calculation</text><text class="t body" x="615" y="679">• Route-safety risk scoring</text>
<rect class="box" x="1085" y="505" width="450" height="210" rx="14" fill="#d1ebc7"/><text class="t head" text-anchor="middle" x="1310" y="536">[C. ASYNC TELEMETRY ENGINE]</text><text class="t sub" text-anchor="middle" x="1310" y="558">database.py · models.py</text><text class="t body" x="1110" y="587">• FastAPI BackgroundTasks &amp; SQLAlchemy ORM</text><text class="t body" x="1110" y="610">• Async log ingestion</text><text class="t body" x="1110" y="633">• Stores raw responses, analytics, queries &amp; alerts</text><text class="t body" x="1110" y="656">• SQLite (sih_weathergpt.db)</text>
<path class="thin" d="M955 476V505M1233 446H1400V505M320 476V505"/>
<path class="wire" d="M1535 610H1680"/><path d="M1680 545v132q80 28 160 0V545q-80-28-160 0z" fill="#badca7" stroke="#5b7258" stroke-width="2"/><ellipse cx="1760" cy="545" rx="80" ry="28" fill="#cfe9bd" stroke="#5b7258" stroke-width="2"/><text class="t head" text-anchor="middle" x="1760" y="605">SQLite</text><text class="t head" text-anchor="middle" x="1760" y="630">Database</text><text class="t small" text-anchor="middle" x="1760" y="704">sih_weathergpt.db</text>

